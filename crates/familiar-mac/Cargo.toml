[package]
name = "familiar-mac"
description = "Familiar macOS app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "familiar"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
# Not used directly: eframe without default features enables no wgpu backend,
# so Metal is switched on here.
wgpu = { version = "25.0.2", default-features = false, features = ["metal", "wgsl"] }
familiar-core = { path = "../familiar-core" }
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
rfd = "0.17.2"
egui_plot = "0.33.0"

[package.metadata.bundle]
name = "Familiar"
identifier = "com.tomsawyermissouri.familiar"
category = "public.app-category.education"
short_description = "Face recognition trainer"
osx_minimum_system_version = "12.0"
# Drawn by scripts/make_icon.py. cargo-bundle resolves this path against the
# directory it is run from, so bundle from the repository root.
icon = ["crates/familiar-mac/icons/icon_*.png"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
